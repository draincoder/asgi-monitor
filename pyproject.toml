[project]
name = "asgi-monitor"
version = "0.6.1"
description = "Quick and easy monitoring setup for ASGI application"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "treaditup", email = "treaditup@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
dependencies = [
    "structlog>=22.1.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-instrumentation-asgi>=0.47b0",
    "click>=8.0.0",
]

[project.scripts]
asgi-monitor = "asgi_monitor.cli:main"

[project.urls]
"Documentation" = "https://asgi-monitor.readthedocs.io"
"Source" = "https://github.com/draincoder/asgi-monitor"
"Homepage" = "https://github.com/draincoder/asgi-monitor"
"Bug Tracker" = "https://github.com/draincoder/asgi-monitor/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
]
test = [
    "opentelemetry-sdk>=1.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-aiohttp>=1.0.5",
    "pytest-cov>=7.1.0",
    "assertpy>=1.1",
    "freezegun>=1.5.5",
    "dirty-equals>=0.11",
    "httpx>=0.27.0",
    "httpx2>=2.0.0",
]
asgi = [
    "aiohttp>=3.10.7",
    "uvicorn>=0.19.0",
    "fastapi>=0.108.0",
    "starlette>=0.31.0",
    "litestar>=2.11.0",
]
wsgi = [
    "gunicorn>=21.2.0",
]
tox = [
    "tox>=4.67.1",
    "tox-uv>=1.37.0",
]
docs = [
    "sphinx>=9.0.4,<9.1; python_version < '3.12'",
    "sphinx>=9.1.0; python_version >= '3.12'",
    "sphinx-autodocgen>=1.4",
    "furo>=2025.12.19",
]

[tool.uv]
required-version = ">=0.13.1"
default-groups = "all"

[tool.tox]
env_list = [
    "3.11-minimum",
    "3.11-latest",
    "3.12-latest",
    "3.13-latest",
    "3.14-latest",
]

[tool.tox.env_run_base]
runner = "uv-venv-runner"
package = "wheel"
dependency_groups = ["test", "asgi", "wsgi"]
uv_resolution = { replace = "if", condition = "factor.minimum", then = "lowest-direct", else = "highest" }
deps = [
    { replace = "ref", of = ["project", "dependencies"], extend = true },
]
commands = [["pytest", "tests", "-q", { replace = "posargs", extend = true }]]

[tool.ruff]
line-length = 120
target-version="py311"
src = ["src"]
include = ["src/**.py", "tests/**.py"]
exclude = ["examples/real_world/app/main.py", "docs/**.py"]

lint.select = [
    "ALL",
]

lint.ignore = [
    "ARG",
    "ANN",
    "D",
    "EM101",
    "EM102",
    "PT001",
    "PT023",
    "SIM108",
    "SIM114",
    "TRY003",
    "PLW2901",
    "RET505",
    "ISC001",
    "UP035",
    "COM812",
    "G002",
    "CPY001",  # Preserve the existing policy without per-file copyright notices.
    "RUF022",  # Preserve the existing public export order.
    "RUF023",  # Preserve the existing slots order.
    "TC006",   # Allow runtime type expressions in cast().
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID252", "PLR2004", "S101", "T201", "SLF001", "PERF203", "S603", "S607"]
"examples/**" = ["T201", "B018", "INP001", "PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "examples"]
no-lines-before = ["local-folder"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
packages = ["src", "tests"]
python_version = "3.11"

strict = true
pretty = true
allow_redefinition = true
allow_untyped_calls = true
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
ignore_missing_imports = true
show_column_numbers = true
show_error_context = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "prometheus_client.metrics"
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = "ignore::DeprecationWarning"
