name: labeler

on:
  pull_request_target:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  labeler:
    name: labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Create labels that do not exist yet.
      pull-requests: write # Apply matching labels to pull requests.

    steps:
      - name: Label pull request
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
