name: ci

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Load cached Pre-Commit Dependencies
        id: cached-pre-commit-dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit/
          key: pre-commit-4|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: Execute Pre-Commit
        run: uv run pre-commit run --show-diff-on-failure --color=always --all-files

  test:
    name: "test ${{ matrix.tox-env }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            tox-env: "3.11-minimum"
          - python-version: "3.11"
            tox-env: "3.11-latest"
          - python-version: "3.12"
            tox-env: "3.12-latest"
          - python-version: "3.13"
            tox-env: "3.13-latest"
          - python-version: "3.14"
            tox-env: "3.14-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install test runner
        run: uv sync --locked --only-group tox

      - name: Run tests
        run: >-
          uv run --only-group tox tox run --recreate -e ${{ matrix.tox-env }} --
          --cov=asgi_monitor --junitxml=junitxml.xml
          --cov-report term --cov-report xml:coverage.xml

      - name: Test coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master') || github.event_name == 'pull_request' && github.base_ref == 'master'
        with:
          pytest-xml-coverage-path: ./coverage.xml
          junitxml-path: ./junitxml.xml
          junitxml-title: ${{ matrix.tox-env }}
          unique-id-for-comment: ${{ matrix.tox-env }}
          report-only-changed-files: true
          create-new-comment: true
