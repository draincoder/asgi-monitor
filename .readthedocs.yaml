version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"

  jobs:
    install:
      - pip install uv==0.13.1
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --no-default-groups --group docs --group asgi --group wsgi

sphinx:
  configuration: docs/conf.py

submodules:
  include: all
  recursive: true
